  --google-gray-700: rgb(95, 99, 104);
  --google-gray-800: rgb(60, 64, 67);
  --google-gray-900: rgb(32, 33, 36);
  --heading-color: var(--google-gray-900);
  --link-color: rgb(88, 88, 88);
  --primary-button-fill-color-active: var(--google-blue-700);
  --primary-button-fill-color: var(--google-blue-600);
  --primary-button-text-color: #fff;

  --secondary-button-text-color: var(--google-gray-700);

}

.nav-wrapper .secondary-button {

.hidden {

}

}

.icon {

}

@media (prefers-color-scheme: dark) {

  user-select: none;
}

[dir='rtl'] button {
  float: left;
}

.neterror button {

}

button:active {
  background: var(--primary-button-fill-color-active);

}

#details {

#details p:not(:first-of-type) {

.dc-card {
  --dc-primary: #000;
  --dc-secondary: #000;
  background: linear-gradient(180deg, var(--dc-primary), var(--dc-secondary));
  border-radius: 8px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .1);
  color: #f2f3f5;
  font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  margin-top: 8px;
  max-width: 320px;
  overflow: hidden;
}

.dc-banner {
  background: #000 center / cover no-repeat;
  height: 105px;
}

.dc-avatar-wrap {
  background: #1e1f22;
  border: 6px solid var(--dc-primary);
  border-radius: 50%;
  height: 80px;
  margin: -46px 0 0 10px;
  position: relative;
  width: 80px;
}

.dc-avatar {
  border-radius: 50%;
  display: block;
  height: 80px;
  width: 80px;
}

.dc-deco {
  height: 96px;
  left: 50%;
  pointer-events: none;
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 96px;
}

.dc-dot {
  background: #80848e;
  border: 6px solid var(--dc-primary);
  border-radius: 50%;
  box-sizing: content-box;
  height: 16px;
  left: 54px;
  position: absolute;
  top: 54px;
  width: 16px;
}

.dc-dot.dc-dnd::after {
  background: #111214;
  border-radius: 2px;
  content: '';
  height: 4px;
  left: 50%;
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
}

.dc-body {
  padding: 8px 16px 16px;
}

.dc-name {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
}

.dc-userrow {
  align-items: center;
  display: flex;
  gap: 8px;
}

.dc-user {
  color: #dbdee1;
  cursor: pointer;
  font-size: 14px;
  position: relative;
}

.dc-user:hover {
  text-decoration: underline;
}

.dc-user::after {
  background: #111214;
  border-radius: 5px;
  bottom: calc(100% + 10px);
  box-shadow: 0 8px 16px rgba(0, 0, 0, .24), 0 0 0 1px rgba(255, 255, 255, .08);
  color: #dbdee1;
  content: attr(data-tip);
  font-size: 13px;
  font-weight: 500;
  left: 50%;
  line-height: 1.2;
  opacity: 0;
  padding: 6px 8px;
  pointer-events: none;
  position: absolute;
  transform: translateX(-50%);
  transition: opacity .1s;
  white-space: nowrap;
  z-index: 5;
}

.dc-user::before {
  border: 5px solid transparent;
  border-top-color: #111214;
  bottom: 100%;
  content: '';
  left: 50%;
  margin-left: -5px;
  opacity: 0;
  pointer-events: none;
  position: absolute;
  transition: opacity .1s;
  z-index: 5;
}

.dc-user:hover::after,
.dc-user:hover::before,
.dc-user:focus-visible::after,
.dc-user:focus-visible::before {
  opacity: 1;
}

.dc-user:focus-visible {
  outline: 2px solid #70a9f0;
  outline-offset: 2px;
}

.dc-badges {
  background: rgba(255, 255, 255, .08);
  border-radius: 8px;
  display: flex;
  gap: 4px;
  padding: 3px 5px;
}

.dc-badges:empty {
  display: none;
}

.dc-badge {
  display: block;
  height: 18px;
  width: 18px;
}

.dc-badge-link {
  display: block;
  position: relative;
}

.dc-badge-link::after {
  background: #111214;
  border-radius: 5px;
  bottom: calc(100% + 10px);
  box-shadow: 0 8px 16px rgba(0, 0, 0, .24), 0 0 0 1px rgba(255, 255, 255, .08);
  color: #dbdee1;
  content: attr(data-tip);
  font-size: 14px;
  font-weight: 500;
  left: 50%;
  line-height: 1.3;
  opacity: 0;
  padding: 8px 12px;
  pointer-events: none;
  position: absolute;
  transform: translateX(-50%);
  transition: opacity .1s;
  white-space: nowrap;
  z-index: 5;
}

.dc-badge-link::before {
  border: 5px solid transparent;
  border-top-color: #111214;
  bottom: 100%;
  content: '';
  left: 50%;
  margin-left: -5px;
  opacity: 0;
  pointer-events: none;
  position: absolute;
  transition: opacity .1s;
  z-index: 5;
}

.dc-badge-link:hover::after,
.dc-badge-link:hover::before,
.dc-badge-link:focus-visible::after,
.dc-badge-link:focus-visible::before {
  opacity: 1;
}

function ghLiveCells(list) {
  var cells = [];
  var first = list[0].date.split("-");
  var firstTs = Date.UTC(+first[0], +first[1] - 1, +first[2]);
  for (var i = new Date(firstTs).getUTCDay(); i > 0; i--) cells.push(null);
  list.forEach(function (d) {
    var p = d.date.split("-");
    cells.push({ t: Date.UTC(+p[0], +p[1] - 1, +p[2]), level: Math.max(0, Math.min(4, d.level | 0)), count: d.count | 0 });
  });
  return cells;
}

function ghBuild(user) {
  var card = document.createElement("div");
  card.className = "gh-card gh-loading";
  card.innerHTML = '<div class="gh-title">Loading contributions\u2026</div><div class="gh-scroll"><div class="gh-graph">' +

    '<div class="gh-legend"><span>Less</span><i class="gh-cell"></i><i class="gh-cell gh-l1"></i><i class="gh-cell gh-l2"></i><i class="gh-cell gh-l3"></i><i class="gh-cell gh-l4"></i><span>More</span></div>';

  function draw(cells, total) {
    card.className = "gh-card";
    card.querySelector(".gh-title").textContent = total + " contributions in the last year";
    var grid = card.querySelector(".gh-grid"), months = card.querySelector(".gh-months");
    grid.textContent = ""; months.textContent = "";
    var cols = Math.ceil(cells.length / 7), prevMonth = -1, lastLabel = -9;
    for (var c = 0; c < cols; c++) {
      var ref = null;
      for (var r = 0; r < 7 && !ref; r++) ref = cells[c * 7 + r];
      if (ref) {
        var m = new Date(ref.t).getUTCMonth();
        if (m !== prevMonth) {
          if (c - lastLabel >= 3) {
            var lab = document.createElement("span");
            lab.textContent = GH_MONTHS[m];
            lab.style.left = c * 10 + "px";
            months.appendChild(lab);
            lastLabel = c;
          }
          prevMonth = m;
        }
      }
    }
    cells.forEach(function (cell) {
      var el = document.createElement("div");
      if (!cell) { el.className = "gh-cell gh-none"; }
      else {
        el.className = "gh-cell gh-l" + cell.level;
        if (cell.count !== null) {
          var dt = new Date(cell.t);
          el.title = (cell.count || "No") + " contribution" + (cell.count === 1 ? "" : "s") + " on " + GH_MONTHS[dt.getUTCMonth()] + " " + dt.getUTCDate();
        }
      }

    sc.scrollLeft = sc.scrollWidth;

      if (total == null) total = j.contributions.reduce(function (n, d) { return n + (d.count | 0); }, 0);
      draw(ghLiveCells(j.contributions), total);

      card.className = "gh-card gh-failed";
      var t = card.querySelector(".gh-title");
      t.textContent = "Couldn\u2019t load contributions. ";
      var a = document.createElement("a");
      a.href = "https://github.com/" + encodeURIComponent(user);
      a.target = "_blank"; a.rel = "noreferrer noopener";
      a.textContent = "View on GitHub";
      t.appendChild(a);
    });
  return card;
}

var ACT_VERB = { 0: "Playing ", 1: "Streaming ", 2: "Listening to ", 3: "Watching ", 5: "Competing in " };

var dcWrap = document.createElement("div");
dcWrap.className = "suggestions";
var dcHead = document.createElement("div");
dcHead.className = "suggestion-header";
dcHead.textContent = "Discord";
var card = document.createElement("div");
card.className = "dc-card";
card.innerHTML = '<div class="dc-banner"></div>' +
  '<div class="dc-avatar-wrap"><img class="dc-avatar" alt="" hidden>' +
  '<img class="dc-deco" alt="" hidden><span class="dc-dot" role="img"></span></div>' +
  '<div class="dc-body"><div class="dc-name"></div><div class="dc-userrow"><div class="dc-user" role="button" tabindex="0" aria-label="Copy username" data-tip="Click to copy username"></div><div class="dc-badges"></div></div>' +
  '<div class="dc-custom" hidden></div>' +
  '<div class="dc-section dc-bio-box" hidden><div class="dc-bio"></div></div>' +
  '<div class="dc-acts" hidden></div></div>';
dcWrap.appendChild(dcHead); dcWrap.appendChild(card);
details.appendChild(dcWrap);

function q(sel) { return card.querySelector(sel); }
var usernameEl = q(".dc-user");
var usernameCopyTimer = null;
function setUsernameCopyFeedback(message) {
  usernameEl.setAttribute("data-tip", message);
  if (usernameCopyTimer) clearTimeout(usernameCopyTimer);
  usernameCopyTimer = setTimeout(function () {
    usernameEl.setAttribute("data-tip", "Click to copy username");
  }, 1600);
}

function copyTextFallback(text) {
  var input = document.createElement("textarea");
  input.value = text;
  input.setAttribute("readonly", "");
  input.style.position = "fixed";
  input.style.opacity = "0";
  document.body.appendChild(input);
  var copied = false;
  try {
    input.select();
    copied = document.execCommand("copy");
  } finally {
    document.body.removeChild(input);
  }
  if (!copied) throw new Error("Browser refused to copy text");
}

function copyProfileUsername() {
  var text = usernameEl.textContent.trim();
  if (!text) return;
  var copied = function () { setUsernameCopyFeedback("Copied"); };
  var failed = function (error) {
    console.error("Could not copy profile username:", error);
    setUsernameCopyFeedback("Could not copy username");
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(copied).catch(function () {
      try {
        copyTextFallback(text);
        copied();
      } catch (error) {
        failed(error);
      }
    });
    return;
  }
  try {
    copyTextFallback(text);
    copied();
  } catch (error) {
    failed(error);
  }
}
usernameEl.addEventListener("click", copyProfileUsername);
usernameEl.addEventListener("keydown", function (event) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    copyProfileUsername();
  }
});

function setText(sel, text) {
  var el = q(sel);
  el.textContent = text || "";
  el.hidden = !text;
}
function isColor(c) { return typeof c === "string" && /^#[0-9a-f]{3,8}$/i.test(c); }
function isHttps(u) { return typeof u === "string" && u.indexOf("https://") === 0; }

var discordProfileBio = "";
function renderBio(value) {
  var bio = typeof value === "string" ? value.trim() : "";
  if (!bio) bio = "https://dead.kim/";
  var bioEl = q(".dc-bio");
  bioEl.textContent = "";
  if (isHttps(bio)) {
    var bioLink = document.createElement("a");
    bioLink.href = bio;
    bioLink.target = "_blank";
    bioLink.rel = "noreferrer noopener";
    bioLink.textContent = bio;
    bioEl.appendChild(bioLink);
  } else {
    bioEl.textContent = bio;
  }
  q(".dc-bio-box").hidden = false;
}

function loadDiscordBio() {
  fetch("https://dcdn.dstn.to/profile/")
    .then(function (response) {
      if (!response.ok) throw new Error("DCDN profile request failed: " + response.status);
      return response.json();
    })
    .then(function (profile) {
      var bio = profile && profile.user_profile && profile.user_profile.bio;
      if (!bio && profile && profile.user) bio = profile.user.bio;
      if (typeof bio === "string" && bio.trim()) {
        discordProfileBio = bio.trim();
        renderBio(discordProfileBio);
      }
    })
    .catch(function (error) {
      console.error("Could not load Discord profile bio:", error);
    });
}

function actImage(a, d) {
  if (a.name === "Spotify" && d.spotify && isHttps(d.spotify.album_art_url)) return d.spotify.album_art_url;
  var li = a.assets && a.assets.large_image;
  if (!li) return "";
  if (li.indexOf("mp:external/") === 0) return "https://media.discordapp.net/external/" + li.slice(12);
  if (li.indexOf("mp:") === 0) return "https://media.discordapp.net/" + li.slice(3);
  if (a.application_id) return "https://cdn.discordapp.com/app-assets/" + encodeURIComponent(a.application_id) + "/" + encodeURIComponent(li) + ".png";
  return "";
}

function renderBadges(isFallback) {
  var box = q(".dc-badges");
  box.textContent = "";
  BADGES.forEach(function (b) {
    var link = document.createElement("a");
    link.className = "dc-badge-link";
    link.href = b.href; link.target = "_blank"; link.rel = "noreferrer noopener";
    link.setAttribute("aria-label", b.title);
    link.setAttribute("data-tip", b.tip);
    var im = document.createElement("img");
    im.className = "dc-badge"; im.alt = "";
    im.onerror = function () { im.onerror = null; im.src = b.local; };
    im.src = isFallback ? b.local : b.cdn;
    link.appendChild(im);
    box.appendChild(link);
  });
}

var SPOTIFY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.34c-.24.36-.66.48-1.02.24-2.82-1.74-6.36-2.1-10.56-1.14-.42.12-.78-.18-.9-.54-.12-.42.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.3 1.02zm1.44-3.3c-.3.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.38-.48.12-.99-.12-1.11-.6-.12-.48.12-.99.6-1.11 4.38-1.32 9.78-.66 13.5 1.62.42.18.6.78.21 1.17zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.3c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.62.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/></svg>';
var spTimer = null;
function spStop() { if (spTimer) { clearInterval(spTimer); spTimer = null; } }
function fmtTime(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  var m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
}

function spotifyCard(sp) {
  var el = document.createElement("div");
  el.className = "dc-section dc-spotify";
  el.innerHTML = '<div class="dc-sp-head"><span>Listening to Spotify</span>' + SPOTIFY_SVG +
    '</div><div class="dc-sp-main"><img class="dc-sp-art" alt="" hidden><div class="dc-sp-text">' +
    '<div class="dc-sp-song"></div><div class="dc-sp-artist"></div>' +
    '<div class="dc-sp-prog"><span class="dc-sp-now">00:00</span><div class="dc-sp-bar"><div class="dc-sp-fill"></div></div><span class="dc-sp-total">00:00</span></div>' +
    '</div></div>';
  el.querySelector(".dc-sp-song").textContent = sp.song || "";
  el.querySelector(".dc-sp-artist").textContent = (sp.artist || "").split("; ").join(", ");
  var art = el.querySelector(".dc-sp-art");
  if (isHttps(sp.album_art_url)) {
    art.onerror = function () { art.hidden = true; };
    art.src = sp.album_art_url;
    art.hidden = false;
  }
  var start = sp.timestamps && sp.timestamps.start, end = sp.timestamps && sp.timestamps.end;
  var total = end - start;
  var now = el.querySelector(".dc-sp-now"), fill = el.querySelector(".dc-sp-fill");
  if (total > 0) {
    el.querySelector(".dc-sp-total").textContent = fmtTime(total);
    var tick = function () {
      var pos = Math.max(0, Math.min(total, Date.now() - start));
      now.textContent = fmtTime(pos);
      fill.style.width = (pos / total * 100) + "%";
    };
    tick();
    spTimer = setInterval(tick, 250);
  }
  return el;
}

function addLine(parent, cls, text) {
  if (!text) return;
  var el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  parent.appendChild(el);
}

function renderDiscord(d, isFallback) {
  var u = d.discord_user || {};
  var kv = d.kv || {};
  var name = u.global_name || u.display_name || u.username || "";
  q(".dc-name").textContent = name;
  q(".dc-user").textContent = u.username || "";
  renderBadges(isFallback);


  var img = q(".dc-avatar");
  img.onerror = function () { img.onerror = null; img.src = LOCAL_AVATAR; };
  if (!isFallback && u.avatar) {
    var ext = u.avatar.indexOf("a_") === 0 ? "gif" : "png";
    img.src = "https://cdn.discordapp.com/avatars/" + DISCORD_ID + "/" + u.avatar + "." + ext + "?size=128";
  } else {
    img.src = LOCAL_AVATAR;
  }
  img.hidden = false;


  var deco = q(".dc-deco");
  var dd = u.avatar_decoration_data;
  if (dd && dd.asset) {
    deco.onerror = function () { deco.hidden = true; };
    deco.src = "https://cdn.discordapp.com/avatar-decoration-presets/" + encodeURIComponent(dd.asset) + ".png?size=96&passthrough=true";
    deco.hidden = false;
  } else {
    deco.hidden = true;
  }


  var st = STATUS_COLOR[d.discord_status] ? d.discord_status : "offline";
  var dot = q(".dc-dot");
  dot.style.background = STATUS_COLOR[st];
  dot.className = "dc-dot" + (st === "dnd" ? " dc-dnd" : "");
  dot.title = STATUS_LABEL[st];
  dot.setAttribute("aria-label", STATUS_LABEL[st]);


  if (isColor(kv.theme_primary)) card.style.setProperty("--dc-primary", kv.theme_primary);
  if (isColor(kv.theme_secondary)) card.style.setProperty("--dc-secondary", kv.theme_secondary);
  q(".dc-banner").style.backgroundImage = isHttps(kv.banner) ? 'url("' + kv.banner.replace(/"/g, "%22") + '")' : "none";
  renderBio(discordProfileBio || kv.bio);


  var custom = null, acts = [];
  (d.activities || []).forEach(function (a) {
    if (a.type === 4) { if (!custom) custom = a; } else { acts.push(a); }
  });
  var customText = "";
  if (custom) {
    if (custom.emoji && custom.emoji.name && !custom.emoji.id) customText = custom.emoji.name + " ";
    customText += custom.state || "";
  }
  setText(".dc-custom", customText.trim());

  var box = q(".dc-acts");
  spStop();
  box.textContent = "";
  acts.forEach(function (a) {
    if (a.name === "Spotify" && d.spotify) { box.appendChild(spotifyCard(d.spotify)); return; }
    var row = document.createElement("div");
    row.className = "dc-section dc-act";
    var src = actImage(a, d);
    if (src) {
      var pic = document.createElement("img");
      pic.className = "dc-act-img"; pic.alt = "";
      pic.onerror = function () { pic.hidden = true; };
      pic.src = src;
      row.appendChild(pic);
    }
    var txt = document.createElement("div");
    txt.className = "dc-act-text";
    addLine(txt, "dc-act-title", (ACT_VERB[a.type] || "") + (a.name || ""));
    addLine(txt, "dc-act-sub", a.details);
    addLine(txt, "dc-act-sub", a.name === "Spotify" && a.state ? "by " + a.state : a.state);
    addLine(txt, "dc-act-sub", a.name === "Spotify" && a.assets ? a.assets.large_text : "");
    row.appendChild(txt);
    box.appendChild(row);
  });
  box.hidden = !acts.length;
}

var dcFails = 0, dcTimer = null;
function loadDiscord() {
  fetch("https://api.lanyard.rest/v1/users/" + DISCORD_ID)
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.success && j.data) { dcFails = 0; renderDiscord(j.data, false); } else { throw 0; } })
    .catch(function () { if (++dcFails >= 3) clearInterval(dcTimer); });
}
renderDiscord(FALLBACK, true);
loadDiscord();
loadDiscordBio();

var dcSocket = null, dcHeartbeat = null, dcReconnect = null;
function connectDiscordSocket() {
  if (!("WebSocket" in window)) return;
  dcSocket = new WebSocket("wss://api.lanyard.rest/socket");
  dcSocket.onopen = function () {
    dcSocket.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
  };
  dcSocket.onmessage = function (event) {
    var message;
    try { message = JSON.parse(event.data); } catch (e) { return; }
    if (message.op === 1 && message.d && message.d.heartbeat_interval) {
      if (dcHeartbeat) clearInterval(dcHeartbeat);
      dcHeartbeat = setInterval(function () {
        if (dcSocket && dcSocket.readyState === WebSocket.OPEN) dcSocket.send(JSON.stringify({ op: 3, d: null }));
      }, message.d.heartbeat_interval);
    }
    if (message.op === 0 && message.d) {
      dcFails = 0;
      renderDiscord(message.d, false);
    }
  };
  dcSocket.onclose = function () {
    if (dcHeartbeat) clearInterval(dcHeartbeat);
    dcHeartbeat = null;
    dcReconnect = setTimeout(connectDiscordSocket, 3000);
  };
  dcSocket.onerror = function () {
    if (dcSocket) dcSocket.close();
  };
}
connectDiscordSocket();

reloadBtn.addEventListener("click", function () {
  window.location.reload();
});
</script>
